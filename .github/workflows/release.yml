name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and attach add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Lint
        run: npx tsc --noEmit

      - name: Build package
        run: |
          npm run dist
          mv localwp-cloudflare-tunnel-*.tgz localwp-cloudflare-tunnel.tgz

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" localwp-cloudflare-tunnel.tgz --clobber
