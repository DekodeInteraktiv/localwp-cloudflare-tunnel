name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx tsc --noEmit

      # Downloads the real cloudflared for this OS, runs it, and opens a real quick tunnel.
      - name: Test
        run: npm test
        env:
          CF_DOWNLOAD: '1'
          CF_TUNNEL: '1'
